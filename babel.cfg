# pybabel extraction (python -m app i18n). Keywords: _ / N_ / t (Python), _ and {% trans %} (Jinja), FS.t (JS).
[python: app/**.py]
keywords = _ N_ t

[jinja2: app/templates/**.html]
extensions = jinja2.ext.i18n
trim_blocks = True
lstrip_blocks = True

[jinja2: app/templates/email/**.txt]
extensions = jinja2.ext.i18n
trim_blocks = True
lstrip_blocks = True

[javascript: app/static/assets/js/**.js]
keywords = FS.t
