[project]
name = "fabiohcsouza"
version = "1.2.0"
description = "fabiohcsouza.dev (portfolio) and blog.fabiohcsouza.dev: FastAPI + Jinja2, SQLite, vanilla CSS/JS"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "jinja2>=3.1",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlmodel>=0.0.22",
  "httpx>=0.27",
  "markdown-it-py>=3.0",
  "mdit-py-plugins>=0.4",
  "pygments>=2.18",
  "python-frontmatter>=1.1",
  "pyyaml>=6.0",
  "python-multipart>=0.0.33",
  "babel>=2.18.0",
  "pillow>=13.0.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "djlint>=1.49.10",
    "pip-audit>=2.10.1",
    "pytest>=8.3",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.7",
    "ty>=0.0.91",
]

[tool.ruff]
line-length = 140
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "SIM"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv]
# Dev tools that ship often: only take releases at least two weeks old.
exclude-newer-package = { regex = "2026-10-26T00:00:00Z", ty = "2026-10-26T00:00:00Z", bandit = "2026-10-26T00:00:00Z", pip-audit = "2026-10-26T00:00:00Z" }

[tool.djlint]
profile = "jinja"
ignore = "H006,H016,H020,H021,H023,H030,H031"  # H016: title is in head.html (include); H020: empty spans are layout hooks

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.ty.src]
include = ["app", "tests"]
